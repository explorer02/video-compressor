plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.compresshd.mediatools'
version = '0.1.0'

android {
  namespace 'expo.modules.mediatools'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The notification layouts use TextAppearance.Compat.Notification styles. Debug builds resolve
  // them transitively through the app, but verifyReleaseResources checks this library against its
  // own dependencies alone — without this line the release build fails resource linking.
  implementation 'androidx.core:core-ktx:1.13.1'
}
